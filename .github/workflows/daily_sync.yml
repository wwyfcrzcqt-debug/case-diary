name: Daily Docket Sync

on:
  schedule:
    # Runs at 12:30 UTC, which is exactly 6:00 PM IST, Monday (1) through Friday (5)
    - cron: '30 12 * * 1-5' 
  workflow_dispatch: # Adds a manual "Run Workflow" button on GitHub

permissions:
  contents: write # Allows the bot to save the JSON file back to your repo

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          pip install pdfplumber playwright
          playwright install chromium
          
      - name: Run Scraper
        run: python3 backend/cause_list_parser.py
        
      - name: Commit and Push Updated JSON
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add app/dashboard/chamber_matters.json
          # Prevents the pipeline from crashing if the court hasn't updated the list yet
          git commit -m "chore: daily automated docket sync" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main