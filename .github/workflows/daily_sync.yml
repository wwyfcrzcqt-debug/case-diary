name: Daily Docket Sync

on:
  schedule:
    # Runs automatically at 2:30 AM UTC (8:00 AM IST) every day
    - cron: '30 2 * * *' 
  workflow_dispatch: # Adds a manual "Run Workflow" button on GitHub

permissions:
  contents: write # Allows the bot to save the JSON file back to your repo

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          pip install pdfplumber playwright
          playwright install chromium
          
      - name: Run Scraper
        run: python3 backend/cause_list_parser.py
        
      - name: Commit and Push Updated JSON
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add app/dashboard/chamber_matters.json
          # Prevents the pipeline from crashing if the court hasn't updated the list yet
          git commit -m "chore: daily automated docket sync" || echo "No changes to commit"
          git pull --rebase orgin main
          git push