name: Daily Docket Sync

on:
  schedule:
    # Runs at 12:30 UTC (6:00 PM IST), Sunday (0) through Thursday (4)
    - cron: '30 12 * * 0-4' 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          pip install pdfplumber playwright
          playwright install chromium
          
      - name: Run Scraper
        run: python3 backend/cause_list_parser.py
        
      - name: Commit and Push Updated JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily automated docket sync"
          file_pattern: "app/dashboard/chamber_matters.json""
